    (function() {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && AC.prototype && AC.prototype.decodeAudioData) {
        var origDecode = AC.prototype.decodeAudioData;
        AC.prototype.decodeAudioData = function(buffer, successCallback, errorCallback) {
          try {
            var res = origDecode.call(this, buffer, successCallback, errorCallback);
            if (res && typeof res.catch === 'function') {
              return res.catch(function(err) {
                if (typeof errorCallback === 'function') {
                  try { errorCallback(err); } catch(e) {}
                }
                return null;
              });
            }
            return res;
          } catch(err) {
            if (typeof errorCallback === 'function') {
              try { errorCallback(err); } catch(e) {}
            }
            return Promise.resolve(null);
          }
        };
      }
    })();
  </script>
